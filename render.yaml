services:
  - type: web
    name: discord-monitor
    runtime: node
    plan: free
    nodeVersion: "22.23.4"
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MONITOR_ADMIN_USERNAME
        sync: false
      - key: MONITOR_ADMIN_PASSWORD
        sync: false
      - key: MONITOR_JOB_TOKEN
        sync: false
      - key: MONITOR_PUBLIC_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/discord-monitor.db
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: アラート対象者
