name: Discord Monitor - Daily Check

on:
  schedule:
    # 1日1回実行（JST 17:00）
    - cron: '0 8 * * *'   # UTC 08:00 = JST 17:00
  
  # 手動実行も可能にする
  workflow_dispatch:

permissions: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Call Discord Monitor API
        env:
          MONITOR_JOB_TOKEN: ${{ secrets.MONITOR_JOB_TOKEN }}
          MONITOR_BASE_URL: ${{ vars.MONITOR_BASE_URL || 'https://discord-monitor-pkoh.onrender.com' }}
        run: |
          set -euo pipefail
          test -n "$MONITOR_JOB_TOKEN" || { echo "MONITOR_JOB_TOKEN is required"; exit 1; }
          echo "Running Discord monitor check..."
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          printf 'Authorization: Bearer %s\n' "$MONITOR_JOB_TOKEN" |
            curl --fail --silent --show-error --max-time 180 --request POST \
              --header @- --output "$response_file" "${MONITOR_BASE_URL%/}/api/jobs/monitor"
          jq -e '[.channelsChecked, .alertsSent, .inactiveCount, .errorCount] | all(.[]; type == "number")' "$response_file" > /dev/null
          echo "Monitor completed successfully"
      
      - name: Display summary
        if: always()
        run: |
          echo "Monitor execution completed at $(date)"
